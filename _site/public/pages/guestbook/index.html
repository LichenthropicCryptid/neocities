<header>

                    <img id="access-fairy" src="https://lichenthropic.neocities.org/images/assets/navi.gif"

                </div>

            <div class="accessability">

                    <button class="filter" onclick="crton(), location.reload()">CRT ON</button>

  <body class="crt">
        <div id="preloader"></div>
            <div id="flex">
                
                <main style="text-align:center">
                
               <h1>GUESTBOOK</h1>
               <iframe src="https://lichenthropic.atabook.org/?page=1" width="100%;" height="1100;"></iframe>

                </main>
          
        </div>
        <style>
    main {
        height: 1250px;
    }
        </style>

<style>
    #access-fairy   {
     position:fixed;
     left: 3rem;
     top: 3rem;
     border-radius: 5rem;
     background-color:#ff0a789f;
     -webkit-box-shadow: 0px 0px 50px 30px #ff0a78c0; 
     box-shadow: 0px 0px 50px 30px #ff0a78c0;
     z-index: 100;
     opacity: 60%;
 }

     #access-fairy:hover {
             opacity: 100%;
         }

 .accessability  {
     color: whitesmoke;
     position: fixed;
     left: 8rem;
     top:8rem;
     display: flex;
     flex-direction: row;
     flex-wrap: wrap;
     background: rgba(0, 0, 0, 0.422);
     box-shadow: 0px 0px 105px 12px rgba(0, 0, 0, 0.961),
     inset 0px 0px 55px 12px rgba(0, 0, 0, 0.506);
     border-radius: 0rem 2.5rem 2.5rem 2.5rem;
     width: 12.5rem;
     height: 12rem;
     z-index: 99;
     padding: 5px;
 }


 .colortheme {
     width: 5rem;
     border-radius: 1rem;
     padding: .5rem;
     margin: 5px;
 }

 .filter {
     width: 5rem;
     border-radius: 1rem;
     padding: .5rem;
     margin: 5px;
 }

</style>
       <script>
        function crton() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt.css');
            localStorage.setItem('filter', 'crt-on');
        }

        function crtoff() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-off.css');
            localStorage.setItem('filter', 'crt-off');
        }

        if (localStorage.getItem('filter') == 'crt-on') {
            crton();
        }

        if (localStorage.getItem('filter') == 'crt-off') {
            crtoff();
        }

    </script>
    <script>

        function lightmode() {
            document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/light.css');
            localStorage.setItem('theme', 'lightmode');
        }

        function darkmode() {
            document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/dark.css');
            localStorage.setItem('theme', 'darkmode');
        }

        if (localStorage.getItem('theme') == 'lightmode') {
            lightmode();
        }

        if (localStorage.getItem('theme') == 'darkmode') {
            darkmode();
        }

    </script>
    <style>
        /* Preloader */
        #preloader {
            background: black url("https://lichenthropic.neocities.org/images/assets/aniglobe.gif") no-repeat center;
            align-items: center;
            justify-content: center;
            width: 100%;
            display: flex;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 9999;
        }
    </style>
    <script>
        var loader = document.getElementById("preloader");

        function hideLoader() {
            if (!loader) return;
            fadeOut();
        }

        function fadeOut() {
            var op = 1;
            var fade = setInterval(function () {
                op -= 0.1;
                if (op <= 0) {
                    clearInterval(fade);
                    loader.style.display = "none";
                } else {
                    loader.style.opacity = op;
                }
            }, 40);
        }

        // Hide once everything has loaded
        window.addEventListener("load", hideLoader);

        // Force-hide after 8 seconds even if it can't load
        setTimeout(hideLoader, 8000);
    </script>
        
  </body>
  </html>
