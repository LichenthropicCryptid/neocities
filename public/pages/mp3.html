<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 PLAYER</title>
    <link rel="alternate" type="application/rss+xml" title="RSS feed for my site" href="https://lichenthropic.neocities.org/rss.xml"/>
        
    <link id="colortheme" href="/stylesheets/crt-on.css" rel="stylesheet" type="text/css" media="all">
              <script type="module">
  import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";

  new fairyDustCursor({
  colors: ["#8EBD00", "#A4FF2E", "#DCFF0F"],
  fairySymbol: "★",
});
</script>
    <script src="webamp.bundle.min.js"></script>
<div id="app"></div>
<script>
    const Webamp = window.Webamp;
    const webamp = new Webamp({
        initialTracks: [
    {
        metaData: {
        artist: "Michael Serroul",
    title: "Bong Break"
				},
    url: "https://files.catbox.moe/7d1fyv.mp3",
			}
    ]
	});

    webamp.renderWhenReady(document.getElementById('app'));
</script>
            
     <script>
         function lightmode() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/light.css');
            localStorage.setItem('theme', 'lightmode');}
  
            function darkmode() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-off.css');
            localStorage.setItem('theme', 'darkmode');}
  
            function crtdark() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-on.css');
            localStorage.setItem('theme', 'crtdark');}
            
            function crtlight() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-light.css');
            localStorage.setItem('theme', 'crtlight');}
                
            if(localStorage.getItem('theme') == 'lightmode'){
            lightmode();
            }
            
            if(localStorage.getItem('theme') == 'darkmode'){
            darkmode();
            }
            
            if(localStorage.getItem('theme') == 'crtdark'){
            crtdark();
            }
            
            if(localStorage.getItem('theme') == 'crtlight'){
            crtlight();
            }
            
        </script>
</html>
