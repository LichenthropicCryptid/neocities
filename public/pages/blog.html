<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLOG</title>

    <link rel="alternate" type="application/rss+xml" title="RSS feed for my site"
        href="https://lichenthropic.neocities.org/rss.xml" />

    <link id="blog-structure" rel="stylesheet" href="../stylesheets/blog.css" type="text/css" media="all">

    <link id="filter" rel="stylesheet" href="../stylesheets/crt.css" type="text/css" media="all">

    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">

    <script src="../javascript/freezeframe.js"></script>

    <script src="../javascript/templates/blog.js"></script>

    <script type="module">

        import { fairyDustCursor } from "https://unpkg.com/cursor-effects@latest/dist/esm.js";

        new fairyDustCursor({

            colors: ["#8EBD00", "#A4FF2E", "#DCFF0F"],

            fairySymbol: "★",

        });

    </script>

</head>
<body class="crt">
    <div id="preloader"></div>
<main>
    <div class="tumblr">
        <iframe class="tumblr-page" src='https://lichenthropic-cryptid.tumblr.com/tagged/feed'
            style="height: 100; border: 10px groove #0a0a0a;overflow:hidden;" scrolling="no" name="tumblr-blog"
            title="tumblr"></iframe>
    </div>
</main>
    <script>
        function crton() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt.css');
            localStorage.setItem('filter', 'crt-on');
        }

        function crtoff() {
            document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt-off.css');
            localStorage.setItem('filter', 'crt-off');
        }

        if (localStorage.getItem('filter') == 'crt-on') {
            crton();
        }

        if (localStorage.getItem('filter') == 'crt-off') {
            crtoff();
        }

    </script>   
    <style>
        /* Preloader */
        #preloader {
            background: black url("https://file.garden/anb5fb-RvmNCRWUD/misc/weed-orb.gif") no-repeat center;
            align-items: center;
            justify-content: center;
            width: 100%;
            display: flex;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 9999;
        }
    </style>
    <script>
        var loader = document.getElementById("preloader");

        function hideLoader() {
            if (!loader) return;
            fadeOut();
        }

        function fadeOut() {
            var op = 1;
            var fade = setInterval(function () {
                op -= 0.1;
                if (op <= 0) {
                    clearInterval(fade);
                    loader.style.display = "none";
                } else {
                    loader.style.opacity = op;
                }
            }, 40);
        }

        // Hide once everything has loaded
        window.addEventListener("load", hideLoader);

        // Force-hide after 8 seconds even if it can't load
        setTimeout(hideLoader, 8000);
    </script>
</body>

</html>
