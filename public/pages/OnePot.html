            /* Preloader */
        #preloader {
        background: black
            url("https://file.garden/anb5fb-RvmNCRWUD/misc/weed-orb.gif")
            no-repeat center;
        align-items: center;
        justify-content: center;

        }

            <script>
            var loader = document.getElementById("preloader");

        function hideLoader() {
        if (!loader) return;
        fadeOut();
        }

        function fadeOut() {
          var op = 1;
          var fade = setInterval(function () {
            op -= 0.1;
            if (op <= 0) {
              clearInterval(fade);
              loader.style.display = "none";
            } else {
              loader.style.opacity = op;
            }
          }, 40);
        }

        // Hide once everything has loaded
        window.addEventListener("load", hideLoader);

        // Force-hide after 8 seconds even if it can't load
        setTimeout(hideLoader, 8000);
            </script>
            
            <script>
            document.querySelectorAll('.draggable').forEach(el => {
              let isDragging = false;
              let offsetX, offsetY;
  
              el.addEventListener('mousedown', (e) => {
                isDragging = true;
                offsetX = e.clientX - el.offsetLeft;
                offsetY = e.clientY - el.offsetTop;
                el.style.cursor = 'grabbing';
              });
  
              document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                el.style.left = (e.clientX - offsetX) + 'px';
                el.style.top = (e.clientY - offsetY) + 'px';
              });
  
              document.addEventListener('mouseup', () => {
                isDragging = false;
                el.style.cursor = 'grab';
              });
            });
            </script>
             <script>
        
            function lightmode() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/light.css');

            function darkmode() {
                document.getElementById('colortheme').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/dark.css');
            localStorage.setItem('theme', 'darkmode');}
  
            function crtfilter() {
                document.getElementById('filter').setAttribute('href', 'https://lichenthropic.neocities.org/stylesheets/crt.css');
            localStorage.setItem('theme', 'crtfilter');}
                
            if(localStorage.getItem('theme') == 'lightmode'){
            lightmode();
            }
            
            if(localStorage.getItem('theme') == 'darkmode'){

            }
            
            if(localStorage.getItem('theme') == 'crt-filter'){

            }    
            
        </script>
